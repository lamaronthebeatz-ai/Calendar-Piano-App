name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04  # Playwright 1.56 has no browser builds for ubuntu-latest (26.04)
    # a stuck runner otherwise holds the deploy for GitHub's default 6 hours
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: each article's "last updated" date comes from git
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Nothing is deployed unless every check passes (docs/roadmap.md, stage 1).
      - run: npm run lint
      - run: npm run check:links
      - run: npm run build -- --base=./
      - run: npm run budget
      # the browsers are kept between runs, keyed by the Playwright version; the install once hung 24 minutes on a runner
      - id: pw
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright browsers (3 tries of 5 minutes)
        timeout-minutes: 16
        run: |
          what="chromium webkit"
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then cmd="install-deps"; else cmd="install --with-deps"; fi
          for i in 1 2 3; do
            timeout 300 npx playwright $cmd $what && exit 0
            echo "::warning::playwright $cmd try $i did not finish, retrying"
          done
          exit 1
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Pages has stalled past the default 10 minutes twice (runs #317, #322) with a green build
          timeout: 1200000
